<!DOCTYPE html>
<html lang="ru">
<head>

<title>SUBSISTENCE SYSTEM — BACKROOMS OPERATING SYSTEM v2.0 CONSOLE</title>
<style>
  :root{
    --bg:#04120a; --bg-deep:#020a06; --br:#0f3d24; --br-bright:#1c7a45;
    --g:#5cff92; --g-bright:#b6ffd0; --g-dim:#2f8c53; --g-dark:#175c35;
    --y:#ffe680; --r:#ff6b5e; --sel:#0b2a18;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#010603;overflow:hidden}
  body{
    font-family:"Courier New",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:15px;color:var(--g);text-shadow:0 0 7px rgba(92,255,146,.35);padding:8px;
  }
  #screen{
    position:relative;height:100%;border:1px solid var(--br);
    background:linear-gradient(180deg,#04120a 0%, #030d07 55%, #020a06 100%);
    display:flex;flex-direction:column;overflow:hidden;
  }
  #screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 3px),
               radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---------------- ШАПКА ---------------- */
  #hdr{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:5px 10px;border-bottom:1px solid var(--br);
    color:#8effb4;font-size:13.5px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;
  }
  #hdr .right{color:var(--g-dim)}
  #hdr b{color:#b6ffd0;font-weight:normal}
  #hdr .lnk{cursor:pointer;color:#b6ffd0}
  #hdr .lnk:hover{color:#fff;text-decoration:underline}

  /* ---------------- ТЕЛО ---------------- */
  #body{flex:1;display:flex;min-height:0}
  #side{width:268px;min-width:268px;border-right:1px solid var(--br);padding:10px 0;overflow-y:auto}
  #side .item{
    padding:6px 12px;cursor:pointer;font-size:13.5px;letter-spacing:.4px;
    color:#7bffa8;border-left:2px solid transparent;user-select:none;white-space:nowrap;
  }
  #side .item:hover{background:#07200f;border-left-color:var(--g);color:#c6ffdb}
  #side .item.active{background:#0a2c18;border-left-color:#8effb4;color:#d6ffe6}
  #side .sep{height:1px;background:var(--br);margin:8px 10px}
  #side .hint{padding:6px 12px;color:var(--g-dark);font-size:12px;line-height:1.45}
  #side .mlink{padding:7px 12px;color:var(--y);cursor:pointer;font-size:13px;border-left:2px solid transparent}
  #side .mlink:hover{background:#1a1707;border-left-color:var(--y)}

  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #content{flex:1;overflow-y:auto;padding:14px 18px}
  #content::-webkit-scrollbar,#side::-webkit-scrollbar{width:10px}
  #content::-webkit-scrollbar-thumb,#side::-webkit-scrollbar-thumb{background:#0f3d24}
  #content::-webkit-scrollbar-track,#side::-webkit-scrollbar-track{background:#051409}

  /* ---------------- СТРОКА ВВОДА ---------------- */
  #prompt{border-top:1px solid var(--br);padding:6px 10px;display:flex;align-items:center;gap:6px;background:#030f08}
  #prompt .ps1{color:#9dffc0;white-space:nowrap}
  #input{flex:1;background:transparent;border:0;outline:0;color:#c9ffdd;font:inherit;text-shadow:inherit;caret-color:var(--g)}
  #caret{width:9px;height:16px;background:var(--g);animation:bl .95s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #hintbar{
    border-top:1px solid var(--br);padding:4px 10px;display:flex;justify-content:space-between;
    color:var(--g-dim);font-size:12.5px;background:#020a06;white-space:nowrap;overflow:hidden;
  }

  /* ---------------- ЭЛЕМЕНТЫ ---------------- */
  pre{margin:0;font:inherit;line-height:1.06;color:#7dffa8;text-shadow:0 0 12px rgba(92,255,146,.5);
      overflow-x:auto;white-space:pre}
  .dim{color:var(--g-dim)} .dark{color:var(--g-dark)} .ok{color:#5cff92}
  .warn{color:var(--y)} .err{color:var(--r)} .hd{color:#b6ffd0}
  .line{white-space:pre-wrap;word-break:break-word}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .panel{border:1px solid var(--br);padding:10px 12px;margin:10px 0;background:rgba(6,26,15,.35)}
  .panel h4{margin:0 0 6px;font-weight:normal;color:#b6ffd0;letter-spacing:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .kpi div{border:1px solid var(--br);padding:6px 10px;min-width:120px}
  .kpi b{display:block;color:var(--g-dim);font-weight:normal;font-size:11.5px;letter-spacing:1px}
  .kpi span{font-size:19px;color:#a8ffc6}
  button.cmd{
    font:inherit;background:transparent;border:1px solid var(--br-bright);color:#8effb4;
    padding:7px 14px;cursor:pointer;letter-spacing:.6px;text-shadow:inherit;
  }
  button.cmd:hover{background:#0b2a18;color:#d6ffe6}
  .lvl{border-left:3px solid var(--br-bright);padding:6px 10px;margin:8px 0}
  .lvl0{color:#d9cf7a}.lvl1{color:#7fd7e0}.lvl2{color:#9ad67a}
  .toast{
    position:absolute;left:50%;bottom:70px;transform:translateX(-50%);
    border:1px solid var(--br-bright);background:#04150c;padding:7px 14px;color:#b6ffd0;
    opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;font-size:13px;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1}
</style>

/* =====================================================================

   Опросники вынесены отдельно: questions.html (все 57) и questions2.html (19 — те, что допилят игру)
   ===================================================================== */

const Store=(()=>{let mem={},ok=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){ok=false;}
 return{get(k,d){try{const v=ok?localStorage.getItem(k):mem[k];return v==null?d:JSON.parse(v);}catch(e){return d;}},
        set(k,v){try{const s=JSON.stringify(v);if(ok)localStorage.setItem(k,s);else mem[k]=s;}catch(e){mem[k]=JSON.stringify(v);}}}})();

/* ---------- логотип SUBSISTENCE (пиксель-арт 5×7) ---------- */

/* ---------- утилиты ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function now(){const d=new Date();return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toast(m){elToast.textContent=m;elToast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>elToast.classList.remove('show'),2400);}
function tickClock(){document.getElementById('hdrRight').textContent=now()+' · версия 0.2.0 · ОТЛАДКА';}
tickClock(); setInterval(tickClock,30000);

const state={view:'dash',history:[],histIdx:-1,seed:Store.get('subsistence_seed',1337),host:false,online:false};

/* ---------- боковое меню ---------- */
function renderSide(){
  elSide.innerHTML = MENU.map(m=>
    `<div class="item${state.view.toUpperCase()===m.id?' active':''}" data-cmd="${m.id}">[${m.key}] ${esc(m.label)}</div>`
  ).join('')
  + `<div class="sep"></div>`
  + `<div class="mlink" onclick="openQuestions()">▸ ОПРОСНИК ПРОЕКТА (40 вопросов) ↗</div>`
  + `<div class="hint">Команды: PLAY · HOST · JOIN &lt;ip&gt; · MAP · SYSINFO · SETTINGS · HELP · CLS · EXIT</div>`;
  elSide.querySelectorAll('.item').forEach(el=>el.onclick=()=>run(el.dataset.cmd));
}
function openQuestions(){
  try{ const w=window.open(QUESTIONS_PAGE,'_blank'); if(!w) throw 0; toast('опросник открыт в новой вкладке'); }
  catch(e){ toast('опросник: файл site/questions.html — открой его двойным кликом'); }
}

const VIEWS={dash:viewDash, game:viewGame, map:viewMap, sysinfo:viewSysinfo, settings:viewSettings, help:viewHelp};

function render(){
  renderSide();
  elContent.innerHTML=(VIEWS[state.view]||viewDash)();
  elContent.scrollTop=0;
}
function setView(v){state.view=v;render();}

/* ---------- печать загрузки ---------- */
const BOOT_TEXT=
`[BOOT] subsistence core v0.2.0
loading level0_corridors ... starts
level0_corridors generated ... ok
loading level1_poolrooms ... starts
level1_poolrooms generated ... ok
loading level2_powerstation ... starts
level2_powerstation generated ... ok
populating loot nodes ... starts
loot populated ... ok
spawning monsters ... starts
monsters spawned ... ok
building nav graph ... starts
nav graph ready ... ok
creating player ... starts
player ready ... ok`;

function typeBoot(text){
  const lines=text.split('\n');
  elContent.innerHTML=`<div class="line"><span class="dark">C:\\SUBSISTENCE&gt;</span> <span class="hd">${state.host?'HOST':'PLAY'}</span></div><pre id="bootline"></pre>`;
  const out=document.getElementById('bootline');
  let i=0,j=0,cur="";
  const step=()=>{
    if(i>=lines.length){setTimeout(()=>setView('game'),280);return;}
    const line=lines[i];
    if(j<line.length){const chunk=Math.min(4,line.length-j);cur+=line.substr(j,chunk);j+=chunk;out.textContent=cur;setTimeout(step,6);}
    else{cur+="\n";j=0;i++;setTimeout(step,40);}
  };
  step();
}

/* ---------- команды ---------- */
function run(cmdRaw,argsRaw){
  const args=Array.isArray(argsRaw)?argsRaw:(argsRaw==null?[]:[argsRaw]);
  const cmd=String(cmdRaw||'').trim().toUpperCase();
  elHint.textContent='> '+cmd+(args.length?' '+args.join(' '):'');
  switch(cmd){
    case '1': case 'PLAY': state.host=false; state.view='game'; typeBoot(BOOT_TEXT); toast('PLAY: загрузка уровней'); break;
    case '2': case 'HOST': state.host=true;  state.view='game'; typeBoot(BOOT_TEXT); toast('HOST: сервер Mirror запущен (7777)'); break;
    case '3': case 'JOIN': {
      const ip=args[0]||'127.0.0.1'; state.online=true; state.host=false; setView('game');
      elHint.textContent=`> подключение к ${ip}:7777 ... установлено (Mirror, 30 Гц)`;
      toast('JOIN: '+ip+':7777'); break; }
    case '4': case 'MAP': case 'MAPS': setView('map'); break;
    case '5': case 'SYSINFO': case 'ABOUT': case 'STATUS': setView('sysinfo'); break;
    case '6': case 'SETTINGS': setView('settings'); break;
    case '7': case 'HELP': case '?': setView('help'); break;
    case '8': case 'CLS': case 'CLEAR': setView('dash'); toast('экран очищен'); break;
    case '9': case 'EXIT': case 'QUIT':
      elContent.innerHTML=`<div class="line">завершение сеанса...</div>
        <div class="line dim">В Unity-сборке это закрывает приложение (Application.Quit()).</div>
        <div class="line">Спасибо, что играешь в SUBSISTENCE. <span class="ok">Удачи на Level 0 — там нет указателей выхода.</span></div>`;
      elSide.innerHTML=''; break;
    case 'QUESTIONS': case 'BRIF': case 'OPROS': openQuestions(); break;
    case 'SEED': {
      const n=parseInt(args[0]||'',10);
      if(isNaN(n)){toast('SEED: укажи число, например SEED 1337');break;}
      state.seed=n; Store.set('subsistence_seed',n); toast('seed = '+n); break; }
    default:
      elHint.textContent=`> неизвестная команда: ${esc(cmd)} — набери HELP`;
      toast('неизвестная команда: '+cmd);
  }
}

/* ---------- строка ввода ---------- */
elInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=elInput.value.trim(); if(!v) return;
    const parts=v.split(/\s+/);
    state.history.push(v); state.histIdx=state.history.length;
    elInput.value=''; run(parts[0],parts.slice(1));
  } else if(e.key==='ArrowUp'){
    if(!state.history.length) return;
    state.histIdx=Math.max(0,state.histIdx-1);
    elInput.value=state.history[state.histIdx]||''; e.preventDefault();
  } else if(e.key==='ArrowDown'){
    if(!state.history.length) return;
    state.histIdx=Math.min(state.history.length,state.histIdx+1);
    elInput.value=state.history[state.histIdx]||''; e.preventDefault();
  } else if(e.key==='Tab'){
    e.preventDefault();
    const cur=elInput.value.toUpperCase();
    const hit=COMMANDS.find(c=>c.startsWith(cur)); if(hit) elInput.value=hit;
  } else if(e.key==='c'&&e.ctrlKey){
    elInput.value=''; toast('ввод отменён');
  }
});

/* ---------- глобальные хоткеи ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key>='1'&&e.key<='9'){ const m=MENU.find(m=>m.key===e.key); if(m) run(m.id); }
  else if(e.key==='Tab'){ e.preventDefault(); elInput.focus(); }
  else if(e.key.length===1){ elInput.focus(); }
});

/* ---------- прочее ---------- */
function saveSettings(){
  const fov=parseInt((document.getElementById('set_fov')||{}).value||'90',10);
  const sens=parseFloat((document.getElementById('set_sens')||{}).value||'2.2');
  Store.set('subsistence_settings',{fov,sens});
  toast(`настройки сохранены (FOV ${fov}, чувствительность ${sens})`);
}
function applySeed(){
  const n=parseInt((document.getElementById('set_seed')||{}).value||'1337',10);
  state.seed=isNaN(n)?1337:n; Store.set('subsistence_seed',state.seed);
  toast('seed = '+state.seed);
}

render(); run('CLS');
setTimeout(()=>{elInput.focus();},300);
</script>
